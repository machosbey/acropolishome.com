<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - لوحة التحكم | أكروبوليس هوم</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Cairo', 'sans-serif'] },
                    colors: {
                        brand: {
                            gold: '#D4AF37',
                            goldLight: '#F3E5AB',
                            goldDark: '#AA8C2C',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #0f172a; }
        .glass-card { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.05); }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center relative overflow-hidden px-4">

    <!-- Background Decoration -->
    <div class="fixed top-0 left-0 w-full h-full overflow-hidden -z-10 pointer-events-none">
        <div class="absolute -top-40 -right-40 w-96 h-96 bg-brand-gold/20 rounded-full blur-3xl"></div>
        <div class="absolute -bottom-40 -left-40 w-96 h-96 bg-slate-600/30 rounded-full blur-3xl"></div>
    </div>

    <!-- Login Card -->
    <div class="glass-card rounded-3xl p-8 md:p-12 w-full max-w-md shadow-2xl relative border-t border-brand-gold/30">
        
        <div class="flex flex-col items-center mb-8">
            <img src="../UPLOADS/LOGO.png" alt="Acropolis Home Logo" class="h-16 mb-6">
            <h1 class="text-2xl font-black text-white">تسجيل الدخول</h1>
            <p class="text-slate-400 text-sm mt-2 text-center">أدخل بيانات الاعتماد الخاصة بك للوصول إلى لوحة التحكم</p>
        </div>

        <form id="login-form" class="space-y-6">
            <div id="error-msg" class="hidden bg-rose-500/10 border border-rose-500/50 text-rose-400 p-3 rounded-xl text-sm font-bold text-center"></div>

            <div>
                <label class="block text-slate-300 text-sm font-bold mb-2">اسم المستخدم</label>
                <div class="relative">
                    <span class="absolute inset-y-0 right-0 flex items-center pr-4 text-slate-500">
                        <i class="fa-solid fa-user"></i>
                    </span>
                    <input type="text" id="username" class="w-full bg-slate-800/50 border border-slate-700 text-white rounded-xl py-3 pl-4 pr-11 focus:outline-none focus:border-brand-gold focus:ring-1 focus:ring-brand-gold transition-colors" placeholder="admin" required>
                </div>
            </div>

            <div>
                <label class="block text-slate-300 text-sm font-bold mb-2">كلمة المرور</label>
                <div class="relative">
                    <span class="absolute inset-y-0 right-0 flex items-center pr-4 text-slate-500">
                        <i class="fa-solid fa-lock"></i>
                    </span>
                    <input type="password" id="password" class="w-full bg-slate-800/50 border border-slate-700 text-white rounded-xl py-3 pl-4 pr-11 focus:outline-none focus:border-brand-gold focus:ring-1 focus:ring-brand-gold transition-colors" placeholder="••••••••" required>
                </div>
            </div>

            <button type="submit" class="w-full bg-brand-gold hover:bg-brand-goldLight text-slate-900 font-black py-3.5 rounded-xl transition-all duration-300 shadow-lg shadow-brand-gold/20 flex justify-center items-center gap-2">
                <span>دخول</span>
                <i class="fa-solid fa-arrow-left text-sm mt-0.5"></i>
            </button>
        </form>

        <div class="mt-8 pt-6 border-t border-slate-700/50 text-center">
            <a href="../index.html" class="text-slate-400 hover:text-white text-sm font-bold transition-colors">
                <i class="fa-solid fa-house ml-1"></i> العودة للموقع الرئيسي
            </a>
        </div>
    </div>

    <script>
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('button[type="submit"]');
            const errorMsg = document.getElementById('error-msg');
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            
            btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> جاري التحقق...';
            btn.disabled = true;
            errorMsg.classList.add('hidden');

            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const data = await res.json();

                if (res.ok) {
                    localStorage.setItem('adminToken', data.token);
                    localStorage.setItem('adminRole', data.admin.role);
                    localStorage.setItem('adminName', data.admin.name);
                    
                    window.location.href = 'admin-dashboard.html';
                } else {
                    errorMsg.textContent = data.error || 'فشل تسجيل الدخول';
                    errorMsg.classList.remove('hidden');
                    btn.innerHTML = '<span>دخول</span> <i class="fa-solid fa-arrow-left text-sm mt-0.5"></i>';
                    btn.disabled = false;
                }
            } catch (err) {
                errorMsg.textContent = 'تعذر الاتصال بالخادم';
                errorMsg.classList.remove('hidden');
                btn.innerHTML = '<span>دخول</span> <i class="fa-solid fa-arrow-left text-sm mt-0.5"></i>';
                btn.disabled = false;
            }
        });

        // If already logged in, redirect to dashboard
        if(localStorage.getItem('adminToken')) {
            window.location.href = 'admin-dashboard.html';
        }
    </script>
</body>
</html>
